<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ThyroWell">
  <!-- The mark is the range bar from the design system, stood on its side:
       a printed range, and one marker sitting inside it. Nothing else in the
       app is drawn from a different idea. -->
  <rect width="512" height="512" fill="#17181C"/>
  <!-- track -->
  <rect x="112" y="238" width="288" height="36" rx="18" fill="#B8863F" opacity="0.34"/>
  <!-- the printed range -->
  <rect x="176" y="238" width="160" height="36" rx="18" fill="#B8863F"/>
  <!-- the marker, inside the range. Silence is the pass state. -->
  <circle cx="256" cy="256" r="46" fill="#17181C"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#E8C894" stroke-width="20"/>
</svg>
