name: Build Android APK

# Builds an installable ThyroWell .apk in the cloud (no local Android Studio
# needed). Run it manually from the Actions tab → "Build Android APK" →
# "Run workflow". When it finishes, download the .apk from the run's Artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThyroWell-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
