name: Generate signing keystore

# ONE-TIME: creates your app signing key in the cloud (no Android Studio / Java
# needed locally). It reads the passwords/alias you set as repo Secrets, so
# nothing sensitive is printed. Steps:
#   1. Settings → Secrets and variables → Actions → New repository secret. Add:
#        KEYSTORE_PASSWORD  (choose a strong password — remember it forever)
#        KEY_PASSWORD       (can be the same value)
#        KEY_ALIAS          (e.g. thyrowell)
#   2. Actions → "Generate signing keystore" → Run workflow.
#   3. Download the "signing-keystore" artifact. It has:
#        - thyrowell-release.keystore  → KEEP THIS FILE SAFE (back it up; losing
#          it means you can never update the app again)
#        - keystore.b64.txt            → its contents go into a new secret
#   4. Add one more secret: KEYSTORE_BASE64 = the full text of keystore.b64.txt
#   Then run "Build Android APK (release)".
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set KEYSTORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS as repo secrets first (see workflow file header)."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore thyrowell-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=ThyroWell, OU=Coaching, O=ThyroWell, L=Mumbai, C=IN"
          base64 -w0 thyrowell-release.keystore > keystore.b64.txt || base64 thyrowell-release.keystore > keystore.b64.txt
          echo "Keystore generated. Add its base64 (keystore.b64.txt) as the KEYSTORE_BASE64 secret."

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            thyrowell-release.keystore
            keystore.b64.txt
          if-no-files-found: error
