<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>ThyroWell</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0a0d14; }
      body { display: flex; align-items: center; justify-content: center; }
      .spin { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(45,212,191,0.2); border-top-color: #2dd4bf; animation: r 0.8s linear infinite; }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spin"></div>
  </body>
</html>
